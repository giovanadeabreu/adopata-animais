<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopata</title>
</head>
<body>
  <header>
        <h1>Adopata</h1>

        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#animais">Animais</a></li>
                <li><a href="#cadastro">Cadastrar</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="inicio">
            <h2>Encontre seu novo melhor amigo</h2>
            <p>Conheça animais que estão esperando por um novo lar.</p>
            <a href="#animais">Ver animais</a>
        </section>

        <section>
            <h2>Pesquisar animais</h2>

            <form>
                <label for="pesquisa">Pesquisar:</label>
                <input type="text" id="pesquisa" placeholder="Nome do animal">

                <label for="filtro">Espécie:</label>
                <select id="filtro">
                    <option>Todos</option>
                    <option>Cachorro</option>
                    <option>Gato</option>
                </select>

                <label for="ordem">Ordenar por:</label>
                <select id="ordem">
                    <option>Nome</option>
                    <option>Idade</option>
                </select>

                <button type="button">Pesquisar</button>
            </form>
        </section>


    <footer>
        <p>© 2026 Adopata</p>
    </footer>

</body>
</html>
